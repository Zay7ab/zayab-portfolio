<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="AI/ML Engineer - RAG, LLMs, Computer Vision. 15+ production projects. Available for hire."/>
<title>Muhammad Zayab Ansari — AI / ML Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── THEME TOKENS ── */
[data-theme="light"] {
  --bg:          #ffffff;
  --bg-2:        #fafaf9;
  --bg-3:        #f5f3ef;
  --ink:         #0f0f0e;
  --ink-60:      #5a5a58;
  --ink-30:      #b8b8b5;
  --ink-10:      #e8e8e5;
  --accent:      #1a1aff;
  --accent-bg:   #e8e8ff;
  --card-bg:     #ffffff;
  --card-border: #e8e8e5;
  --nav-bg:      rgba(255,255,255,0.92);
  --marquee-bg:  #0f0f0e;
  --marquee-txt: #ffffff;
  --exp-bg:      #0f0f0e;
  --exp-txt:     #ffffff;
  --exp-sub:     rgba(255,255,255,0.55);
  --exp-border:  rgba(255,255,255,0.08);
  --toggle-bg:   #e8e8e5;
  --toggle-knob: #0f0f0e;
  --shadow:      0 4px 40px rgba(0,0,0,0.07);
}
[data-theme="dark"] {
  --bg:          #0c0c0b;
  --bg-2:        #111110;
  --bg-3:        #161614;
  --ink:         #f0efe9;
  --ink-60:      #9a9a94;
  --ink-30:      #4a4a47;
  --ink-10:      #242422;
  --accent:      #4d4dff;
  --accent-bg:   #16163a;
  --card-bg:     #111110;
  --card-border: #242422;
  --nav-bg:      rgba(12,12,11,0.92);
  --marquee-bg:  #111110;
  --marquee-txt: #f0efe9;
  --exp-bg:      #111110;
  --exp-txt:     #f0efe9;
  --exp-sub:     rgba(240,239,233,0.5);
  --exp-border:  rgba(255,255,255,0.06);
  --toggle-bg:   #242422;
  --toggle-knob: #f0efe9;
  --shadow:      0 4px 40px rgba(0,0,0,0.4);
}

html{scroll-behavior:smooth}
body{
  font-family:'Syne',sans-serif;
  background:var(--bg);
  color:var(--ink);
  overflow-x:hidden;
  transition:background 0.4s ease,color 0.4s ease;
}

/* ── SCROLL PROGRESS ── */
#scrollProgress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--accent), #5e5ce0, #bf5af2);
  z-index: 10000; transition: width 0.1s linear;
}

/* ── CURSOR ── */
.cursor{display:none;width:10px;height:10px;background:var(--accent);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s,background .2s;mix-blend-mode:difference}
.cursor-ring{display:none;width:36px;height:36px;border:1.5px solid var(--accent);border-radius:50%;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .13s ease;opacity:.5}
@media(pointer:fine){.cursor{display:block}.cursor-ring{display:block}body{cursor:none}}

/* ── PARTICLE CANVAS ── */
#particleCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:0.3; }

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:22px 60px;background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--ink-10);transition:background .4s,border-color .4s}
nav.scrolled { background:var(--nav-bg); backdrop-filter:blur(24px); }
.nav-logo{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:36px;list-style:none;align-items:center}
.nav-links a{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:var(--accent)}

.theme-toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle-track{width:44px;height:24px;background:var(--toggle-bg);border-radius:12px;position:relative;transition:background .3s;border:1px solid var(--ink-10)}
.toggle-knob{width:18px;height:18px;background:var(--toggle-knob);border-radius:50%;position:absolute;top:2px;left:3px;transition:transform .3s,background .3s}
[data-theme="dark"] .toggle-knob{transform:translateX(20px)}

.nav-right{display:flex;align-items:center;gap:16px}
.hamburger{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:40px;height:40px;cursor:pointer;background:none;border:none;padding:8px;z-index:1001}
.hamburger span{display:block;width:22px;height:2px;background:var(--ink);transition:all .3s ease;border-radius:2px}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.mobile-menu{display:none;position:fixed;inset:0;background:var(--bg);z-index:900;flex-direction:column;justify-content:center;align-items:center;gap:32px;padding:100px 40px 60px;opacity:0;transform:translateY(-16px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
.mobile-menu.open{opacity:1;transform:translateY(0);pointer-events:all}
.mobile-menu a{font-family:'Syne',sans-serif;font-size:26px;font-weight:700;color:var(--ink);text-decoration:none}
.mobile-menu-footer{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-30);text-align:center;margin-top:auto}

/* ── HERO ── */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;padding-top:80px;position:relative;overflow:hidden}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:80px 60px;position:relative;z-index:2}

.availability-badge {
  display:inline-flex; align-items:center; gap:8px;
  background: linear-gradient(135deg, rgba(52,199,89,0.15), rgba(26,26,255,0.08));
  border:1px solid rgba(52,199,89,0.3); border-radius:40px;
  padding:6px 16px; margin-bottom:20px; font-size:11px; font-weight:600;
  backdrop-filter:blur(8px); width:fit-content;
}
.availability-badge .dot { width:8px; height:8px; background:#34c759; border-radius:50%; animation: pulse-green 2s infinite; }
@keyframes pulse-green { 0%,100%{ box-shadow:0 0 0 0 rgba(52,199,89,0.7); } 50%{ box-shadow:0 0 0 6px rgba(52,199,89,0); } }
.availability-badge .avail-date { background: rgba(26,26,255,0.15); color:var(--accent); padding:2px 8px; border-radius:20px; font-size:10px; margin-left:4px; }

.hero-tag{font-family:'DM Mono',monospace;font-size:11px;font-weight:400;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:28px;display:flex;align-items:center;gap:12px}
.hero-tag::before{content:'';display:block;width:32px;height:1px;background:var(--accent)}
.hero-name{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(50px,5.5vw,78px);font-weight:300;line-height:1.0;color:var(--ink);margin-bottom:10px}
.hero-name em{font-style:italic;color:var(--accent)}
.hero-title{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-60);margin-bottom:12px}
#typingText { font-family:'DM Mono',monospace; font-size:13px; font-weight:500; color:var(--accent); margin-bottom:24px; min-height:48px; }
.hero-bio{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;line-height:1.8;color:var(--ink-60);max-width:460px;font-weight:300;margin-bottom:28px}
.hero-actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:32px;}
.btn-primary{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;background:var(--ink);color:var(--bg);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:none;cursor:pointer;transition:background .2s,transform .2s}
.btn-primary:hover{background:var(--accent);transform:translateY(-2px)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:transparent;color:var(--ink);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1.5px solid var(--ink-30);transition:border-color .2s,color .2s}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

.github-stats { display:flex; gap:24px; flex-wrap:wrap; margin-top:16px; margin-bottom:20px; }
.github-stat { font-family:'DM Mono',monospace; font-size:10px; color:var(--ink-60); background:var(--bg-3); padding:6px 14px; border-radius:30px; border:1px solid var(--ink-10); }
.github-stat i { margin-right:6px; color:var(--accent); }
.github-stat span { font-weight:700; color:var(--ink); }

.fiverr-widget {
  display:inline-flex; align-items:center; gap:12px;
  background:var(--bg-3); border:1px solid var(--ink-10);
  border-radius:16px; padding:10px 20px; margin-top:12px;
  text-decoration:none; color:var(--ink); transition:all 0.2s;
}
.fiverr-widget:hover { border-color:#1dbf73; transform:translateY(-2px); }
.fiverr-badge { background:#1dbf73; color:white; font-size:9px; font-weight:700; padding:3px 10px; border-radius:20px; font-family:'DM Mono',monospace; }
.fiverr-stars { color:#ffc107; font-size:12px; }
.fiverr-text { font-size:11px; font-weight:600; font-family:'Syne',sans-serif; }
.fiverr-sub { font-size:9px; color:var(--ink-60); font-family:'DM Mono',monospace; }

.hero-right{position:relative;overflow:hidden;background:var(--bg-3)}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(var(--ink-10) 1px,transparent 1px),linear-gradient(90deg,var(--ink-10) 1px,transparent 1px);background-size:48px 48px;opacity:.5}
.hero-card{position:absolute;background:var(--card-bg);border:1px solid var(--card-border);padding:22px 26px;box-shadow:var(--shadow)}
.hero-card-1{top:14%;left:8%;width:196px;animation:float1 6s ease-in-out infinite}
.hero-card-2{top:41%;left:37%;width:186px;animation:float2 8s ease-in-out infinite}
.hero-card-3{top:64%;left:5%;width:206px;animation:float3 7s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float3{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.card-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-30);margin-bottom:6px}
.card-value{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ink)}
.card-sub{font-size:11px;color:var(--ink-60);margin-top:4px}
.accent-bar{width:22px;height:2px;background:var(--accent);margin-bottom:10px}
.hero-scroll{position:absolute;bottom:40px;left:60px;display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-30)}
.scroll-line{width:44px;height:1px;background:var(--ink-30);animation:scrollPulse 2s ease-in-out infinite}
@keyframes scrollPulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ── MARQUEE ── */
.marquee-wrap{overflow:hidden;border-top:1px solid var(--ink-10);border-bottom:1px solid var(--ink-10);background:var(--marquee-bg);padding:15px 0}
.marquee-track{display:flex;width:max-content;animation:marquee 28s linear infinite}
.marquee-track span{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--marquee-txt);padding:0 36px;white-space:nowrap}
.marquee-track .dot{color:var(--accent)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ── SECTIONS ── */
section{padding:110px 60px}
.section-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:72px;padding-bottom:28px;border-bottom:1px solid var(--ink-10)}
.section-num{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-30)}
.section-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(34px,4vw,50px);font-weight:300;line-height:1.1;color:var(--ink)}
.section-title em{font-style:italic;color:var(--accent)}

/* ── ABOUT ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}
.about-text{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.85;font-weight:300;color:var(--ink-60)}
.about-text strong{color:var(--ink);font-weight:400}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.stat-box{background:var(--bg-3);padding:28px 24px;border:1px solid var(--ink-10);transition:background .2s,transform .2s}
.stat-box:hover{background:var(--accent-bg);transform:translateY(-3px)}
.stat-n{font-family:'Cormorant Garamond',Georgia,serif;font-size:46px;font-weight:300;color:var(--ink);line-height:1;margin-bottom:6px}
.stat-n sup{font-size:18px;color:var(--accent)}
.stat-l{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-60)}

.tech-stack-section { margin-top:48px; }
.tech-stack-title { font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-60); margin-bottom:20px; letter-spacing:2px; text-transform:uppercase; }
.tech-logos { display:flex; flex-wrap:wrap; gap:8px; }
.tech-logo-item { display:flex; flex-direction:column; align-items:center; gap:4px; background:var(--card-bg); border:1px solid var(--ink-10); border-radius:12px; padding:10px 14px; min-width:70px; transition:all 0.2s; }
.tech-logo-item:hover { border-color:var(--accent); transform:translateY(-2px); }
.tech-logo-item .tech-icon { font-size:22px; }
.tech-logo-item .tech-name { font-size:9px; font-weight:600; color:var(--ink-60); font-family:'DM Mono',monospace; }

/* ── SERVICES ── */
.services-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; margin-bottom:0; }
.service-card { background:var(--card-bg); border:1px solid var(--card-border); padding:32px 24px; text-align:center; transition:transform 0.2s,box-shadow 0.2s; }
.service-card:hover { transform:translateY(-4px); box-shadow:var(--shadow); background:var(--bg-3); }
.service-icon { font-size:38px; margin-bottom:16px; }
.service-card h3 { font-family:'Syne',sans-serif; font-size:16px; font-weight:700; margin-bottom:10px; color:var(--ink); }
.service-card p { font-family:'Cormorant Garamond',Georgia,serif; font-size:13px; color:var(--ink-60); line-height:1.5; }

/* ── SKILLS ── */
.skills-section{background:var(--bg-3)}
.skills-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.skill-card{background:var(--card-bg);padding:32px 28px;border:1px solid var(--card-border);transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.skill-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:0;background:var(--accent);transition:height .3s ease}
.skill-card:hover::before{height:100%}
.skill-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.skill-icon{font-size:26px;margin-bottom:14px}
.skill-name{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:12px}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:var(--bg-3);color:var(--ink-60);padding:4px 9px;border:1px solid var(--ink-10)}

/* ── PROJECTS ── */
.project-controls { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px; margin-bottom:40px; }
.search-box { flex:1; max-width:280px; position:relative; }
.search-box input { width:100%; padding:10px 16px 10px 38px; background:var(--bg-3); border:1px solid var(--ink-10); border-radius:40px; color:var(--ink); font-family:'DM Mono',monospace; font-size:11px; }
.search-box i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-60); font-size:12px; }
.filter-buttons { display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn { background:transparent; border:1px solid var(--ink-30); padding:6px 16px; border-radius:30px; cursor:pointer; font-size:10px; font-family:'DM Mono',monospace; font-weight:500; color:var(--ink-60); transition:all 0.2s; text-transform:uppercase; }
.filter-btn.active,.filter-btn:hover { background:var(--accent); border-color:var(--accent); color:white; }

.projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.proj-card{background:var(--card-bg);border:1px solid var(--card-border);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s;position:relative;cursor:pointer}
.proj-card:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,0.12)}
.proj-card:hover .proj-img-overlay{opacity:1}
.proj-img{width:100%;height:200px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.proj-img-overlay{position:absolute;inset:0;background:rgba(26,26,255,0.85);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.proj-img-overlay span{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.proj-img svg{width:100%;height:100%;position:absolute;inset:0}
.proj-body-inner{padding:28px 28px 32px}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.proj-num{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-30)}
.proj-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:5px 10px}
.proj-badge.featured{background:var(--accent);color:#fff}
.proj-badge.medical{background:#059669;color:#fff}
.proj-name{font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
.proj-desc{font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;font-weight:300;color:var(--ink-60);line-height:1.6;margin-bottom:16px}
.proj-tech{display:flex;flex-wrap:wrap;gap:5px}
.proj-tech span{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-bg);padding:3px 8px}
.proj-arrow-wrap{position:absolute;bottom:28px;right:28px;font-size:18px;color:var(--ink-30);transition:transform .2s,color .2s}
.proj-card:hover .proj-arrow-wrap{transform:translate(3px,-3px);color:var(--accent)}
.proj-card.wide{grid-column:span 2;flex-direction:row}
.proj-card.wide .proj-img{width:42%;height:auto;min-height:220px;flex-shrink:0}
.proj-card.wide .proj-body-inner{flex:1;padding:36px 36px 40px}
.proj-card.wide .proj-name{font-size:22px}

/* ── TESTIMONIALS ── */
.testimonials-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:20px; }
.testimonial-card { background:var(--card-bg); border:1px solid var(--card-border); padding:28px; transition:transform 0.2s; }
.testimonial-card:hover { transform:translateY(-3px); background:var(--bg-3); }
.testimonial-stars { color:#ffc107; margin-bottom:14px; font-size:12px; letter-spacing:2px; }
.testimonial-text { font-family:'Cormorant Garamond',Georgia,serif; font-size:14px; color:var(--ink-60); line-height:1.6; margin-bottom:16px; font-style:italic; }
.testimonial-author { font-family:'Syne',sans-serif; font-weight:700; font-size:12px; color:var(--ink); }
.testimonial-title { font-family:'DM Mono',monospace; font-size:9px; color:var(--ink-60); margin-top:4px; }

/* ── EXPERIENCE ── */
.exp-section{background:var(--exp-bg);color:var(--exp-txt)}
.exp-section .section-title{color:var(--exp-txt)}
.exp-section .section-num{color:rgba(255,255,255,.25)}
.exp-section .section-header{border-bottom-color:var(--exp-border)}
.exp-list{display:flex;flex-direction:colum
